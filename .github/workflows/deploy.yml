# FILE: .github/workflows/deploy.yml
# OmniMedia Deploy — executa em push para main após o CI passar.
# Faz deploy do frontend para o VPS via rsync + SSH.
# Configure os secrets no repositório:
#   VPS_HOST, VPS_USER, VPS_SSH_KEY, VPS_DEPLOY_PATH

name: Deploy

on:
  push:
    branches: [main]

# Garante que apenas um deploy rode por vez
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: []   # CI deve ser um workflow separado com branch protection
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install & Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build
        env:
          VITE_API_URL: /api
          VITE_API_URL_NATIVE: ${{ secrets.API_URL_NATIVE }}

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy frontend (rsync)
        run: |
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no" \
            frontend/dist/ \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:${{ secrets.VPS_DEPLOY_PATH }}/frontend/"

      - name: Deploy backend & restart
        run: |
          ssh -i ~/.ssh/deploy_key \
              "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
              "cd ${{ secrets.VPS_DEPLOY_PATH }}/backend && \
               git pull origin main && \
               npm ci --omit=dev && \
               npm run migrate && \
               pm2 restart omnimedia-api || pm2 start server.js --name omnimedia-api"

      - name: Health check
        run: |
          sleep 5
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://${{ secrets.VPS_HOST }}/api/health")
          echo "Health: $STATUS"
          [ "$STATUS" = "200" ]
