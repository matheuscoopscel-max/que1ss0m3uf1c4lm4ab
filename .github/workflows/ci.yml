# FILE: .github/workflows/ci.yml
# OmniMedia CI — executa em todo push e pull request.
# Jobs: lint-frontend, build-frontend, lint-backend, build-backend

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Frontend ────────────────────────────────────────────────────────────────
  build-frontend:
    name: Frontend — Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_API_URL: /api
          VITE_API_URL_NATIVE: https://api.omnimedia.app/api

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 7

  # ── Backend ─────────────────────────────────────────────────────────────────
  build-backend:
    name: Backend — Build & Validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check syntax (node --check)
        run: |
          node --check server.js
          node --check src/db/pool.js
          node --check src/models/Plugin.js
          node --check src/routes/plugins.js
          node --check src/services/pluginValidator.js

  # ── Docker ──────────────────────────────────────────────────────────────────
  docker-build:
    name: Docker — Build Image
    runs-on: ubuntu-latest
    needs: [build-backend]

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t omnimedia-api:ci ./backend

      - name: Smoke test (container health)
        run: |
          docker run -d --name omnimedia_test \
            -e DATABASE_URL=postgresql://x:x@localhost/x \
            -e PORT=3001 \
            -p 3001:3001 \
            omnimedia-api:ci node server.js &
          sleep 3
          # Verifica que o servidor sobe mesmo sem banco (responde 503 no health)
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3001/api/health)
          echo "Health status: $STATUS"
          if [ "$STATUS" != "200" ] && [ "$STATUS" != "503" ]; then
            echo "Unexpected status: $STATUS"; exit 1
          fi
