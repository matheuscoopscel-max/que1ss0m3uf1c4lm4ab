services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: omnimedia
      POSTGRES_PASSWORD: omnimedia
      POSTGRES_DB: omnimedia
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U omnimedia"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://omnimedia:omnimedia@postgres:5432/omnimedia?schema=public
    ports:
      - "3000:3000"

volumes:
  postgres_data:
