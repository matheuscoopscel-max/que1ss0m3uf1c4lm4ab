<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- ── SEO ────────────────────────────────────────────────────────────── -->
    <title>OmniMedia — Agregador de Mídias Open-Source</title>
    <meta name="description" content="Agregador unificado de quadrinhos, e-books e streaming de vídeo. Modular, open-source e multiplataforma via sistema de plugins da comunidade." />
    <meta name="keywords" content="manga, quadrinhos, ebooks, streaming, hls, open source, plugins" />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#0a0a0f" />

    <!-- ── Open Graph ─────────────────────────────────────────────────────── -->
    <meta property="og:type"        content="website" />
    <meta property="og:title"       content="OmniMedia — Agregador de Mídias Open-Source" />
    <meta property="og:description" content="Agregador unificado de quadrinhos, e-books e streaming via plugins da comunidade." />
    <meta property="og:image"       content="/og-image.png" />
    <meta property="og:site_name"   content="OmniMedia" />

    <!-- ── PWA / Mobile ───────────────────────────────────────────────────── -->
    <meta name="mobile-web-app-capable"       content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title"   content="OmniMedia" />
    <link rel="manifest" href="/manifest.json" />

    <!-- ── Fonts ──────────────────────────────────────────────────────────── -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

      rel="stylesheet"
    />
  </head>
  <body class="bg-om-bg text-om-text antialiased">
