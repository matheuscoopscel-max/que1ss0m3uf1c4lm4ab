# =============================================================================
# OmniMedia — Nginx Reverse Proxy
# Arquivo: /etc/nginx/sites-available/omnimedia
# =============================================================================
# Substitua SEU_IP_DA_VPS pelo IP público da sua VPS Oracle.
# Após comprar o domínio, substitua pelo domínio real e rode o Certbot.

server {
    listen 80;
    server_name SEU_IP_DA_VPS api.seudominio.com;

    # ── Rate limiting básico ──────────────────────────────────────────────────
    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/m;

    # ── Logs ──────────────────────────────────────────────────────────────────
    access_log /var/log/nginx/omnimedia-access.log;
    error_log  /var/log/nginx/omnimedia-error.log;

    # ── Proxy para o Node.js ──────────────────────────────────────────────────
    location /api/ {
        limit_req zone=api burst=20 nodelay;

        proxy_pass         http://127.0.0.1:3001;
        proxy_http_version 1.1;

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;

        # Buffer
        proxy_buffering    on;
        proxy_buffer_size  8k;
        proxy_buffers      8 8k;
    }

    # ── Uploads estáticos (avatars, banners) ──────────────────────────────────
    location /uploads/ {
        alias /var/www/omnimedia/uploads/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff;
    }

    # ── Health check público ──────────────────────────────────────────────────
    location /health {
        proxy_pass http://127.0.0.1:3001/api/health;
    }

    # ── Bloqueia acesso direto a arquivos sensíveis ───────────────────────────
    location ~ /\.(env|git|htaccess) {
        deny all;
        return 404;
    }
}

# =============================================================================
# APÓS COMPRAR O DOMÍNIO:
# 1. Adicione o domínio no server_name acima
# 2. Rode: certbot --nginx -d api.seudominio.com
# 3. O Certbot vai criar automaticamente o bloco HTTPS abaixo
# =============================================================================
